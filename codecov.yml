# Codecov configuration
#
# Gates:
#  - c-core: the core C library coverage must stay at >= target (90%)
#    with a 1% threshold; PRs that drop coverage below that floor fail.
#  - php-binding: the PHP binding C sources (bindings/php/src/) must stay
#    at >= target (90%) with a 1% threshold, measured through the PHP test
#    suite; PRs that drop coverage below that floor fail.
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        informational: true
      c-core:
        target: 90%
        threshold: 1%
        flags:
          - c-core
      php-binding:
        target: 90%
        threshold: 1%
        flags:
          - php-binding
