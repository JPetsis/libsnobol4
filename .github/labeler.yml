# Path-based PR labels (actions/labeler v5)
# Each label maps to a match object (not plain globs — v5 breaking change).
# Labels must exist in the repo.

core (C):
  - changed-files:
      - any-glob-to-any-file: 'core/**/*'

php-binding:
  - changed-files:
      - any-glob-to-any-file: 'bindings/php/**/*'

build / packaging:
  - changed-files:
      - any-glob-to-any-file:
          - 'CMakeLists.txt'
          - 'core/CMakeLists.txt'
          - 'bindings/php/CMakeLists.txt'
          - '.github/workflows/release.yml'
          - '.github/workflows/ci-*.yml'
          - '.github/workflows/coverage.yml'
          - '.github/workflows/pr-hygiene.yml'
          - '.github/workflows/labeler.yml'
          - '.github/workflows/dependabot-auto-merge.yml'
          - 'composer.json'
          - '.gitattributes'

performance:
  - changed-files:
      - any-glob-to-any-file:
          - 'core/src/search_*.c'
          - 'core/src/vm_exec.c'
          - 'bench/**/*'
          - 'bindings/php/probe.php'

portability:
  - changed-files:
      - any-glob-to-any-file:
          - 'core/include/**/*'
          - 'bindings/php/config.m4'
          - 'bindings/php/config.w32'
          - 'bindings/php/CMakeLists.txt'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'docs/**/*'
          - 'CHANGELOG.md'
          - '.github/ISSUE_TEMPLATE/**/*'
          - '.github/pull_request_template.md'
