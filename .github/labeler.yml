# Path-based PR labels (actions/labeler v5)
# Labels must exist in the repo. Each entry is an array of glob patterns.

core (C):
  - core/**/*

php-binding:
  - bindings/php/**/*

build / packaging:
  - CMakeLists.txt
  - core/CMakeLists.txt
  - bindings/php/CMakeLists.txt
  - .github/workflows/release.yml
  - .github/workflows/ci-*.yml
  - .github/workflows/coverage.yml
  - .github/workflows/pr-hygiene.yml
  - .github/workflows/labeler.yml
  - composer.json
  - .gitattributes

performance:
  - core/src/search_*.c
  - core/src/vm_exec.c
  - bench/**/*
  - bindings/php/probe.php

portability:
  - core/include/**/*
  - bindings/php/config.m4
  - bindings/php/config.w32
  - bindings/php/CMakeLists.txt

documentation:
  - README.md
  - docs/**/*
  - CHANGELOG.md
  - .github/ISSUE_TEMPLATE/**/*
  - .github/pull_request_template.md
