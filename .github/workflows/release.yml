name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Draft release first — the binary builder uploads assets into an existing
  # release, and immutable releases require a draft to attach assets.
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}
      - name: Create draft release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft --notes-from-tag

  # Pre-built PIE binaries (Linux x86_64 + aarch64, macOS x86_64 + arm64).
  # Windows uses php/php-windows-builder in the windows job below.
  build-binaries:
    name: ${{ matrix.os }} (${{ matrix.arch }}, PHP ${{ matrix.php-version }})
    needs: [create-draft-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            php-version: '8.3'
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            php-version: '8.4'
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            php-version: '8.3'
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            php-version: '8.4'
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
            php-version: '8.3'
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
            php-version: '8.4'
          - os: darwin
            arch: arm64
            runner: macos-14
            php-version: '8.3'
          - os: darwin
            arch: arm64
            runner: macos-14
            php-version: '8.4'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf
          sudo rm -f /etc/apt/sources.list.d/ondrej-php* /etc/apt/sources.list.d/*ondrej*
          sudo add-apt-repository --no-update -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php${{ matrix.php-version }}-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf

      - name: Verify core amalgamation is up to date
        run: ./dev/generate_amalgam.sh verify

      - name: Generate core version header
        run: ./dev/generate_version_header.sh

      - name: Build and attach PIE binary
        id: php-ext-binary-builder
        uses: php/pie-ext-binary-builder@0.0.3
        with:
          build-path: bindings/php
          release-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Windows: PIE requires pre-built DLLs; use the official PHP Windows builder.
  windows:
    name: Windows x86_64 (PHP ${{ matrix.php-version }})
    needs: [create-draft-release]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4' ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: x86_64
          ts: nts

      - name: Attach Windows binaries to the release
        uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Source tarball (respects .gitattributes export-ignore).
  source-tarball:
    runs-on: ubuntu-latest
    needs: [create-draft-release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source tarball
        run: |
          git archive --format=zip --prefix=libsnobol4-${{ github.ref_name }}/ \
            -o libsnobol4-${{ github.ref_name }}-src.zip HEAD

      - name: Attach source tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            libsnobol4-${{ github.ref_name }}-src.zip
