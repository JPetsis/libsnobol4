name: Auto-label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs in the context of the base branch, so the
      # config fetched below is always the latest from main — not the PR
      # head branch, which may carry a stale .github/labeler.yml.
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
