name: Documentation (Doxygen)

on:
  push:
    branches: [ main ]
    paths:
      - 'core/include/snobol/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy Doxygen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        # Pages deploy returns HTTP 404 until the GitHub Pages site is
        # enabled in the repository settings. Until then the artifact is
        # still produced and uploaded; the live deploy is a no-op. This
        # step's failure must not block the workflow — see the
        # "Pages status" step below for an explicit warning.
        continue-on-error: true

      - name: Pages status
        if: steps.deployment.outcome == 'failure' || steps.deployment.conclusion == 'failure'
        run: |
          echo "::warning::GitHub Pages deploy failed. This usually means the" \
            "Pages site has not been enabled in the repository settings." \
            "Enable it at: https://github.com/JPetsis/libsnobol4/settings/pages" \
            "(Source: GitHub Actions). The build artifact was still produced" \
            "and uploaded successfully."
